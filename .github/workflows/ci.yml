name: CI

on:
  push:
    branches: [maister]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    # The tray icon targets net9.0-windows, so the solution builds on Windows only.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet test Filum.sln --configuration Release

  install:
    name: Install script
    # The script registers a service, firewall rules and a sign-in entry, which only a real
    # Windows machine has, so it runs on one, from a publish made the way the release makes it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Publish as the release does
        shell: pwsh
        run: |
          foreach ($project in 'Filum.Server', 'Filum.Tray') {
              dotnet publish "server/src/$project/$project.csproj" --configuration Release `
                  --runtime win-x64 --self-contained -p:PublishSingleFile=true --output "$env:RUNNER_TEMP/release"
          }
          Copy-Item server/install/Install-Filum.ps1 "$env:RUNNER_TEMP/release"
      # A server started by hand before the service keeps its key in its user's profile. The
      # installer is to move that key to the service, so the phones paired with it stay paired.
      - name: Run the server by hand first
        shell: pwsh
        run: |
          $server = Start-Process -PassThru -FilePath "$env:RUNNER_TEMP\release\Filum.Server.exe" -ArgumentList @(
              "--Filum:Root=$env:RUNNER_TEMP\by-hand",
              '--Filum:Bind=127.0.0.1',
              '--Filum:Port=8767',
              '--Filum:EnableMdns=false'
          )
          try {
              $offer = $null
              foreach ($attempt in 1..30) {
                  try {
                      $offer = Invoke-RestMethod https://127.0.0.1:8767/api/v1/pair/new -SkipCertificateCheck
                      break
                  } catch {
                      Start-Sleep -Seconds 1
                  }
              }
              if (-not $offer) { throw 'The server started by hand does not answer on port 8767.' }
          } finally {
              Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          $published = Get-PfxCertificate -FilePath (Join-Path $env:LOCALAPPDATA 'Filum\server.cer')
          "HAND_KEY=$($published.Thumbprint)" >> $env:GITHUB_ENV
      # A backup written before the service, with rights such a backup can have: every
      # signed-in user may change it, as below the root of a data drive, and one directory
      # belongs to a group that is not administrators and grants that group a right of its own.
      - name: Leave a backup made before the service
        shell: pwsh
        run: |
          function Invoke-Icacls { & icacls.exe @args | Out-Null; if ($LASTEXITCODE) { throw "icacls $args failed." } }
          $root = Join-Path $env:RUNNER_TEMP 'backup'
          $device = Join-Path $root 'phone-abc123'
          New-Item -ItemType Directory -Force (Join-Path $device '.filum'), (Join-Path $device 'files\DCIM') | Out-Null
          Set-Content -LiteralPath (Join-Path $device 'files\DCIM\a.jpg') -Value 'kept'
          Invoke-Icacls $root /grant '*S-1-5-11:(OI)(CI)M'
          Invoke-Icacls (Join-Path $device 'files\DCIM') /grant '*S-1-5-32-545:(OI)(CI)M'
          Invoke-Icacls (Join-Path $device 'files') /setowner '*S-1-5-32-545'
      # Windows PowerShell 5.1, as on a computer nobody has installed anything on.
      - name: Install
        shell: powershell
        run: '& "$env:RUNNER_TEMP\release\Install-Filum.ps1" -Root "$env:RUNNER_TEMP\backup" -Port 8766'
      - name: Everything is in place and the service answers
        shell: pwsh
        run: |
          if ((Get-Service Filum).Status -ne 'Running') { throw 'The service is not running.' }

          # The service runs under its own virtual account and keeps no privilege but traversing
          # directories, so a flaw in it reaches no further than what that account may touch.
          $account = (Get-CimInstance Win32_Service -Filter "Name='Filum'").StartName
          if ($account -ne 'NT SERVICE\Filum') { throw "The service runs as $account." }
          $privileges = [regex]::Matches((& sc.exe qprivs Filum) -join "`n", 'Se\w+Privilege').Value
          if ("$privileges" -ne 'SeChangeNotifyPrivilege') { throw "The service keeps privileges: $privileges." }
          if (-not [Diagnostics.EventLog]::SourceExists('Filum.Server')) { throw 'The service has no event log source.' }

          foreach ($rule in 'Filum-TCP-In', 'Filum-mDNS-In') {
              if ((Get-NetFirewallRule -Name $rule).Profile -ne 'Any') { throw "$rule is not open on every profile." }
          }
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name Filum -ErrorAction SilentlyContinue)) {
              throw 'The tray icon does not start at sign-in.'
          }

          $config = Join-Path $env:ProgramData 'Filum'
          $users = (New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-545').Translate([Security.Principal.NTAccount]).Value
          function Readers($file) { (Get-Acl $file).Access | Where-Object { $_.IdentityReference.Value -eq $users } }
          if (Readers (Join-Path $config 'server.pfx')) { throw 'Users can read the private key.' }
          if (-not (Readers (Join-Path $config 'server.cer'))) { throw 'Users cannot read server.cer.' }

          # The key of the server started by hand moved: the service serves it, the profile
          # holds it no longer, and the user who ran that server has no right of their own to it.
          if ((Get-PfxCertificate -FilePath (Join-Path $config 'server.cer')).Thumbprint -ne $env:HAND_KEY) {
              throw 'The service did not take the key of the server started by hand.'
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Filum\server.pfx')) {
              throw 'The key is still in the profile of the user who started the server by hand.'
          }
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $rules = (Get-Acl (Join-Path $config 'server.pfx')).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
          if ($rules | Where-Object { $_.IdentityReference -eq $user }) {
              throw 'The user who started the server by hand has a right of their own to the key.'
          }

          $offer = $null
          foreach ($attempt in 1..30) {
              try {
                  $offer = Invoke-RestMethod https://127.0.0.1:8766/api/v1/pair/new -SkipCertificateCheck
                  break
              } catch {
                  Start-Sleep -Seconds 1
              }
          }
          if (-not $offer) { throw 'The service does not answer on port 8766.' }

          # Pairing writes the device's record into the backup, so it shows that the service's
          # account may write there.
          $key = [Security.Cryptography.ECDsa]::Create([Security.Cryptography.ECCurve+NamedCurves]::nistP256)
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new('CN=CI phone', $key, [Security.Cryptography.HashAlgorithmName]::SHA256)
          $phone = $request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddDays(-1), [DateTimeOffset]::UtcNow.AddDays(1))
          $body = @{ cert = [Convert]::ToBase64String($phone.Export('Cert')); label = 'CI phone' } | ConvertTo-Json
          Invoke-RestMethod https://127.0.0.1:8766/api/v1/pair -Method Post -Body $body -ContentType 'application/json' `
              -Headers @{ Authorization = "Bearer $($offer.payload.t)" } -SkipCertificateCheck | Out-Null
          $device = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'backup') -Directory | Where-Object Name -like 'ci-phone-*'
          if (-not $device -or -not (Test-Path (Join-Path $device.FullName '.filum\device.json'))) {
              throw 'Pairing wrote no device record into the backup.'
          }
      # Whoever could write to the backup could make a link there for the service to write
      # through, or destroy the backup. The user who installs reads it.
      - name: Only the service may write to the backup
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'backup'
          $service = (New-Object Security.Principal.NTAccount 'NT SERVICE\Filum').Translate([Security.Principal.SecurityIdentifier]).Value
          $writers = 'S-1-5-18', 'S-1-5-32-544', $service
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $rootRules = (Get-Acl -LiteralPath $root).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
          if (-not ($rootRules | Where-Object { $_.IdentityReference.Value -eq $service -and $_.FileSystemRights.HasFlag([Security.AccessControl.FileSystemRights]::Modify) })) {
              throw "The service's account may not change the backup."
          }
          # Rights that change something: data, attributes, deletion, the rights themselves,
          # ownership, and generic write and all.
          $changing = 0x500D0156
          if (-not (Get-Acl -LiteralPath $root).AreAccessRulesProtected) {
              throw 'The backup root inherits rights from its parent.'
          }
          foreach ($item in @(Get-Item -LiteralPath $root -Force) + @(Get-ChildItem -LiteralPath $root -Force -Recurse)) {
              $acl = Get-Acl -LiteralPath $item.FullName
              $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object AccessControlType -eq 'Allow')
              foreach ($rule in $rules) {
                  if (([int]$rule.FileSystemRights -band $changing) -and $rule.IdentityReference.Value -notin $writers) {
                      throw "$($rule.IdentityReference) may change $($item.FullName)."
                  }
              }
              if (-not ($rules | Where-Object { $_.IdentityReference.Value -eq $user -and $_.FileSystemRights.HasFlag([Security.AccessControl.FileSystemRights]::ReadAndExecute) })) {
                  throw "The user who installed may not read $($item.FullName)."
              }
              # The owner of a directory may always change its rights, and so make an entry in it.
              $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
              if ($item.PSIsContainer -and $owner -notin $writers) { throw "$($item.FullName) belongs to $owner." }
          }
          if ((Get-Content -LiteralPath (Join-Path $root 'phone-abc123\files\DCIM\a.jpg')) -ne 'kept') {
              throw 'The backup made before the service changed.'
          }
      - name: Uninstall
        shell: powershell
        run: '& "$env:ProgramFiles\Filum\Install-Filum.ps1" -Uninstall'
      - name: Only the backup and the key remain
        shell: pwsh
        run: |
          if (Get-Service Filum -ErrorAction SilentlyContinue) { throw 'The service is still registered.' }
          if (Get-NetFirewallRule -Name 'Filum-TCP-In' -ErrorAction SilentlyContinue) { throw 'The firewall rule is still there.' }
          if (Test-Path "$env:ProgramFiles\Filum") { throw 'The program files are still there.' }
          if (-not (Test-Path "$env:RUNNER_TEMP\backup")) { throw 'The backup root is gone.' }
          if (-not (Test-Path (Join-Path $env:ProgramData 'Filum\server.pfx'))) { throw 'The key is gone.' }
          if ([Diagnostics.EventLog]::SourceExists('Filum.Server')) { throw 'The event log source is still there.' }
      # Installing changes the rights of everything under the root, so the installer takes no
      # root that is a whole drive or holds more than backups, and none holding a link, which
      # the change - and the service - would follow out of the backup.
      - name: The installer refuses a root that is not a backup's
        shell: powershell
        run: |
          $foreign = Join-Path $env:RUNNER_TEMP 'foreign'
          $linked = Join-Path $env:RUNNER_TEMP 'linked'
          $drive = Join-Path $env:RUNNER_TEMP 'drive'
          New-Item -ItemType Directory -Force (Join-Path $foreign 'Documents'), (Join-Path $linked 'phone-abc123\.filum'), (Join-Path $linked 'phone-abc123\files'), $drive | Out-Null
          $link = New-Item -ItemType Junction -Path (Join-Path $linked 'phone-abc123\files\DCIM') -Target $foreign
          if (-not ($link.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'The junction was not made.' }
          $letter = [char[]]'XYZW' | Where-Object { -not (Test-Path "$($_):\") } | Select-Object -First 1
          subst "$($letter):" $drive
          if (-not (Test-Path "$($letter):\")) { throw "subst did not make $($letter):." }
          try {
              foreach ($case in @(@("$($letter):\", 'whole drive'), @($foreign, 'more than backups'), @($linked, 'is a link'))) {
                  $root, $reason = $case
                  $refused = $false
                  try {
                      & "$env:RUNNER_TEMP\release\Install-Filum.ps1" -Root $root -Port 8766
                  } catch {
                      if ("$_" -notmatch $reason) { throw "The installer refused $root for another reason: $_" }
                      $refused = $true
                      Write-Host "Refused $root - $_"
                  }
                  if (-not $refused) { throw "The installer took $root as a backup root." }
              }
          } finally {
              subst "$($letter):" /D
          }
          if (Get-Service Filum -ErrorAction SilentlyContinue) { throw 'A refused install left a service behind.' }
      - name: Service log
        if: failure()
        shell: pwsh
        run: Get-WinEvent -LogName Application -MaxEvents 30 | Format-List TimeCreated, ProviderName, Message

  verifier:
    name: Ledger verifier
    # A third implementation of the ledger and path rules, in Python's standard library
    # only - so it runs on the runner's own interpreter, with nothing to install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tools -v

  android:
    name: Android tests and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache instead of the default proprietary service.
          cache-provider: basic
      # :core:protocol is a plain JVM module: its tests run under "test", and
      # testDebugUnitTest alone would leave them out without a word.
      - run: ./gradlew testDebugUnitTest :core:protocol:test assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: filum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  conformance:
    name: Client against server
    # The Kotlin client against the C# server over real mTLS - the one test that checks
    # the two implementations agree (android/README.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache instead of the default proprietary service.
          cache-provider: basic

      # Compiled before the server starts: the pairing token expires after ten
      # minutes, and a cold Gradle build on Windows can take longer than that.
      - name: Compile the client tests
        working-directory: android
        run: ./gradlew.bat :core:sync:compileDebugUnitTestKotlin

      - name: Build the server
        run: dotnet build server/src/Filum.Server/Filum.Server.csproj --configuration Release

      # The server and the test share one step: a server started in a step of its own
      # was gone by the time the next step ran, and the client found nothing listening.
      - name: Run the conformance test against an isolated server
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'filum'
          New-Item -ItemType Directory -Force $work | Out-Null
          $server = Start-Process -PassThru -FilePath dotnet -ArgumentList @(
              'server/src/Filum.Server/bin/Release/net9.0/Filum.Server.dll',
              "--Filum:Root=$work/backup",
              "--Filum:ConfigDirectory=$work/config",
              '--Filum:Bind=127.0.0.1',
              '--Filum:Port=8766',
              # Kestrel reports a failed TLS handshake only at Debug level.
              '--Logging:LogLevel:Microsoft.AspNetCore.Server.Kestrel=Debug'
          ) -RedirectStandardOutput "$work/server.log" -RedirectStandardError "$work/server.err.log"

          try {
              $offer = $null
              foreach ($attempt in 1..60) {
                  try {
                      $offer = Invoke-RestMethod https://127.0.0.1:8766/api/v1/pair/new -SkipCertificateCheck
                      break
                  } catch {
                      Start-Sleep -Seconds 1
                  }
              }
              if (-not $offer) { throw 'The server did not start within a minute.' }

              $env:FILUM_HOST = '127.0.0.1'
              $env:FILUM_PORT = '8766'
              $env:FILUM_PIN = $offer.payload.k
              $env:FILUM_TOKEN = $offer.payload.t

              Push-Location android
              ./gradlew.bat :core:sync:testDebugUnitTest --tests "*EndToEndTest*"
              $result = $LASTEXITCODE
              Pop-Location
          } finally {
              Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          exit $result

      # The test is skipped, not failed, when the server variables are missing; a green
      # job must not hide that it never ran.
      - name: Check that it ran
        shell: pwsh
        run: |
          $report = [xml](Get-Content android/core/sync/build/test-results/testDebugUnitTest/TEST-pl.wspa.filum.sync.EndToEndTest.xml)
          if ($report.testsuite.tests -ne '1' -or $report.testsuite.skipped -ne '0') {
              throw "The conformance test did not run: tests=$($report.testsuite.tests), skipped=$($report.testsuite.skipped)."
          }

      - name: Server log
        if: failure()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'filum/server.log'), (Join-Path $env:RUNNER_TEMP 'filum/server.err.log') -ErrorAction SilentlyContinue
