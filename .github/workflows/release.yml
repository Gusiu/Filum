name: Release

# A pushed tag vX.Y.Z builds the server and the APK and publishes them as a release.
# Started by hand, the workflow only builds, so the packaging can be checked before
# a tag exists.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: The tag, the app and the server agree
        run: |
          app=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          server=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' server/Directory.Build.props)
          echo "app $app, server $server"
          if [ "$app" != "$server" ]; then
            echo "::error::The app is $app and the server is $server."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $app."
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  server:
    name: Server package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Publish the service and the tray icon
        shell: pwsh
        run: |
          # One self-contained executable each (ADR-004): nothing to install on the computer
          # first, not even the .NET runtime.
          foreach ($project in 'Filum.Server', 'Filum.Tray') {
              dotnet publish "server/src/$project/$project.csproj" --configuration Release `
                  --runtime win-x64 --self-contained -p:PublishSingleFile=true --output publish
          }
          Compress-Archive -Path publish/* -DestinationPath "filum-server-${{ needs.version.outputs.version }}-win-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: filum-server-*.zip

  android:
    name: Android package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache instead of the default proprietary service.
          cache-provider: basic
      # A release installs over the one before only if it carries the same key, so a tag is
      # published with the release key or not at all (android/README.md says how to create
      # it). Started by hand without the key, the workflow builds the APK unsigned, which
      # checks the packaging and installs nowhere.
      - name: The release key
        env:
          KEYSTORE: ${{ secrets.FILUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::The FILUM_KEYSTORE_BASE64 secret is missing."
              exit 1
            fi
            echo "::warning::No release key: the APK is built unsigned."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FILUM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - working-directory: android
        env:
          FILUM_KEYSTORE_PASSWORD: ${{ secrets.FILUM_KEYSTORE_PASSWORD }}
          FILUM_KEY_ALIAS: ${{ secrets.FILUM_KEY_ALIAS }}
          FILUM_KEY_PASSWORD: ${{ secrets.FILUM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - run: |
          for apk in android/app/build/outputs/apk/release/*.apk; do
            case "$apk" in *-unsigned.apk) suffix=-unsigned ;; *) suffix= ;; esac
            cp "$apk" "filum-${{ needs.version.outputs.version }}$suffix.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: filum-*.apk

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [version, server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Filum $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "The APK is signed with the release key, so later releases install over it; install it by sideloading. The server zip holds self-contained executables for Windows: no .NET runtime is needed."
